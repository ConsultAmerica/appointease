# Local PostgreSQL for AppointEase (matches default DATABASE_URL in .env.example).
# From this folder: docker compose up -d
# Then: npm run db:migrate && npm run db:seed

services:
  postgres:
    image: postgres:16-alpine
    container_name: appointease-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointease
    volumes:
      - appointease_pgdata:/var/lib/postgresql/data

volumes:
  appointease_pgdata:
