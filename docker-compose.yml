# Local Postgres for AppointmentAI — use with DATABASE_URL in .env
# Start: docker compose up -d
# Stop:  docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: appointease-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointease
    volumes:
      - appointease_pgdata:/var/lib/postgresql/data

volumes:
  appointease_pgdata:
